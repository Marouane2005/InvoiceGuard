[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "invoiceguard"
version = "1.4.2"
description = "Open-source invoice extraction with deterministic checks and a human review queue."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pyyaml>=6"]

[project.scripts]
invoiceguard = "invoiceguard.cli:main"

[tool.setuptools.packages.find]
include = ["invoiceguard*"]

[tool.setuptools.package-data]
invoiceguard = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
