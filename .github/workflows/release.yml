# Runs only when YOU push a version tag (for example v1.4.0). Nothing is published otherwise.
# Result: a private container image on GitHub's registry and a GitHub Release with the changelog notes.
name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tag, code version and release notes agree
        run: python scripts/check_release_tag.py "${GITHUB_REF_NAME}"
      - run: pip install -c constraints.txt -e ".[dev]"
      - run: python scripts/export_openapi.py --check
      - run: python -m pytest -q
      - run: pip install pip-audit && pip-audit -r constraints.txt
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: release notes from CHANGELOG.md
        run: python scripts/release_notes.py "${GITHUB_REF_NAME#v}" > RELEASE_NOTES.md
      - name: image name (lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --title "InvoiceGuard ${GITHUB_REF_NAME#v}" --notes-file RELEASE_NOTES.md
